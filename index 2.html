<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <link rel="stylesheet" href="style 2.css">
</head>
<body>
    <h1>天体の話をしましょうか</h1>
    <h2>一度は見るべき天体3選</h2>
    <table border="1">
        <thead>
            <tr>
                <th>天体名</th>
                <th>名称</th>
                <th>画像</th>
                <th>解説</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>NGC3372</td>
                <td>イータ<br>カリーナ星雲</td>
                <td><img src="images/NGC3372.png"alt="NGC3372"width="200" height="145"></td>
                <td>りゅうこつ座にある散光星雲です。<br>南半球にある天体で日本では<br>沖縄以南でしか見ることができません。</td>
            </tr>
            <tr>
                <td>M8<p>NGC6523</p></td>
                <td>干潟星雲</td>
                <td><img src="images/M8.png"alt="M8 NGC6523"width="200" height="145"></td>
                <td>いて座にある散光星雲です。<br>夏を代表する天体です。</td>
            </tr>
            <tr>
                <td>M31<p>NGC224</p></td>
                <td>アンドロメダ銀河</td>
                <td><img src="images/M31.png"alt="M31、NGC224"width="200" height="145"></td>
                <td>アンドロメダ座にある渦巻銀河です。<br>肉眼で見える最も遠い天体<br>だといわれています。</td>
            </tr>
        </tbody>    
   </table>
</body>
</html>
